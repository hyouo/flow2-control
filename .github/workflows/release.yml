name: Package web configurator
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run build
      - name: Attach the built site to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          zip -q -r "$RUNNER_TEMP/flow2-control-web.zip" .
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/flow2-control-web.zip"
